# Builds a debug APK you can download and install straight onto a phone.
#
# - Every push and pull request: runs the unit tests and lint, then uploads the APK as a workflow
#   artifact (Actions tab → the run → "Artifacts").
# - Tags (`v0.2.0` or `0.2.0`): additionally attaches the APK to a GitHub Release, so the newest build
#   is one tap away from the phone's browser.
#
# Debug rather than release because release signing needs a keystore, which doesn't belong in the repo.
name: Debug APK

on:
  push:
    branches: ["**"]
    tags:
      # Both spellings. These are GitHub filter globs, not regexes: `[0-9]*` means "starts with a
      # digit", which keeps a `wip-something` tag from publishing a release.
      - "v*"
      - "[0-9]*"
  pull_request:
  workflow_dispatch:

permissions:
  # Only for attaching the APK to a release; nothing here writes code.
  contents: write

concurrency:
  group: debug-apk-${{ github.ref }}
  # Superseded branch builds can go; a tag build is a deliverable, so never cancel one halfway.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # AGP downloads the compileSdk platform if the runner image lacks it, but only with the
      # licences accepted. The image normally has them already; this covers one that doesn't.
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Optional. Without it every run generates a fresh ~/.android/debug.keystore, so each APK is
      # signed by a different key and Android refuses to install one over another ("App not
      # installed"). Export one keystore into a secret to make successive builds upgradeable:
      #   base64 -w0 ~/.android/debug.keystore   → repo secret DEBUG_KEYSTORE_BASE64
      - name: Restore the shared debug keystore
        env:
          KEYSTORE: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          # Checked here rather than in `if:` because the `secrets` context isn't available to a step
          # condition, and this way the log says which path was taken.
          if [ -z "$KEYSTORE" ]; then
            echo "No DEBUG_KEYSTORE_BASE64 secret; this APK gets a throwaway debug key."
            exit 0
          fi
          mkdir -p ~/.android
          printf '%s' "$KEYSTORE" | base64 -d > ~/.android/debug.keystore

      - name: Work out what version this is
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="0.0.0-${GITHUB_SHA::7}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "apk=freeze-$name-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Unit tests and lint
        run: ./gradlew --no-daemon --console=plain :app:testDebugUnitTest :app:lintDebug

      # The version is passed in rather than read from build.gradle.kts, so the APK identifies itself
      # as the tag or commit it was built from. versionCode is the run number: it only ever goes up,
      # which is all Android asks of it.
      - name: Build the debug APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          ./gradlew --no-daemon --console=plain :app:assembleDebug \
            -PfreezeVersionName="$VERSION_NAME" \
            -PfreezeVersionCode="$GITHUB_RUN_NUMBER"

      - name: Name it after the version
        env:
          APK: ${{ steps.version.outputs.apk }}
        run: mv app/build/outputs/apk/debug/app-debug.apk "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.apk }}
          path: ${{ steps.version.outputs.apk }}
          if-no-files-found: error

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports/

      - name: Attach it to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          APK: ${{ steps.version.outputs.apk }}
        run: |
          cat > notes.md <<'NOTES'
          Debug build, for installing straight onto a phone: download the APK below on the phone and
          open it, or from a computer:

          ```sh
          adb install -r freeze-*-debug.apk
          ```

          It is **debug-signed**, so it will not install over a build signed with a different debug key.
          Uninstall the old one first if Android says "App not installed".
          NOTES
          gh release view "$TAG" > /dev/null 2>&1 \
            || gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md
          gh release upload "$TAG" "$APK" --clobber
